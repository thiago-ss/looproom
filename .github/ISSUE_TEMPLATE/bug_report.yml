name: Bug report
description: Report a reproducible Looproom problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please remove private prompts, tokens, account files and personal paths. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small, sanitized example is most helpful.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS, Node, Codex CLI, browser and selected autonomy mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant error text or screenshots. Do not attach a database or account directory.
